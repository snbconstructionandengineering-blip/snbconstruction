<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="SNB Construction and Engineering provides professional construction and engineering services throughout Bangladesh.">
  <title>SNB Construction &amp; Engineering</title>
  <style>
    body { margin: 0; font: 16px/1.5 Arial, Helvetica, sans-serif; color: #172b3a; background: #f3f5f7; }
    #loading { padding: 2rem; }
  </style>
</head>
<body>
  <p id="loading">Loading SNB Construction &amp; Engineering…</p>
  <script>
    (async function () {
      try {
        const source = "https://raw.githubusercontent.com/snbconstructionandengineering-blip/snbconstruction/main/final%20index.html";
        const response = await fetch(source, { cache: "no-cache" });
        if (!response.ok) throw new Error("Could not load the website page.");

        const parser = new DOMParser();
        const page = parser.parseFromString(await response.text(), "text/html");

        // Use the logo file that exists in the repository.
        const logo = page.querySelector(".brand img");
        if (logo) logo.src = "assets/snb-logo.svg";

        // Make the live project easy to find from the main navigation.
        const navigation = page.querySelector(".nav");
        if (navigation && !page.querySelector('.nav a[href="#ongoing-projects"]')) {
          const link = page.createElement("a");
          link.href = "#ongoing-projects";
          link.textContent = "Ongoing Project";
          navigation.insertBefore(link, navigation.querySelector('a[href="#projects"]'));
        }

        // Add the project details provided by SNB without assuming its work package or status.
        if (!page.querySelector("#ongoing-projects")) {
          const section = page.createElement("section");
          section.className = "services";
          section.id = "ongoing-projects";
          section.innerHTML = `
            <div class="wrap">
              <div class="section-head">
                <p class="eyebrow" style="margin-bottom:12px;color:var(--steel);letter-spacing:.08em">Current project</p>
                <h2>Ongoing project</h2>
              </div>
              <div class="service-grid" style="grid-template-columns:1fr;max-width:920px;margin:0 auto">
                <article class="service-card" style="border-top:4px solid var(--gold)">
                  <span class="num" style="color:var(--steel)">DS-10</span>
                  <h3>SASEC Dhaka-Sylhet Highway Corridor Investment Project</h3>
                  <p><strong>Contractor:</strong> China Railway First Group</p>
                  <p><strong>Subcontractor:</strong> SNB Construction and Engineering</p>
                </article>
              </div>
            </div>`;
          const projects = page.querySelector("#projects");
          if (projects) projects.before(section);
        }

        document.open();
        document.write("<!doctype html>" + page.documentElement.outerHTML);
        document.close();
      } catch (error) {
        document.body.innerHTML = "<main style='font:16px system-ui;padding:2rem;color:#172b3a'><h1>Website could not load</h1><p>Please refresh the page. If the problem continues, check that the website source page is available.</p></main>";
      }
    })();
  </script>
</body>
</html>

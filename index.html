<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="SNB Construction and Engineering provides professional construction and engineering services throughout Bangladesh.">
  <title>SNB Construction &amp; Engineering</title>
  <style>
    body { margin: 0; font: 16px/1.5 Arial, Helvetica, sans-serif; color: #172b3a; background: #f3f5f7; }
    #loading { padding: 2rem; }
  </style>
</head>
<body>
  <p id="loading">Loading SNB Construction &amp; Engineering…</p>
  <script>
    (async function () {
      const photos = [
        "IMG-20250816-WA0020.jpg",
        "IMG-20250816-WA0021.jpg",
        "IMG-20250816-WA0079.jpg",
        "IMG-20250816-WA0104.jpg",
        "IMG-20250819-WA0002.jpg",
        "IMG-20250819-WA0043.jpg",
        "IMG-20250823-WA0009.jpg",
        "IMG-20250827-WA0051.jpg",
        "IMG-20250828-WA0055.jpg",
        "IMG-20250831-WA0019.jpg",
        "IMG-20251115-WA0011.jpg",
        "IMG-20251118-WA0005.jpg",
        "IMG-20251124-WA0056.jpg",
        "IMG-20251202-WA0044.jpg",
        "IMG20241014173127.jpg",
        "IMG20250601160609.jpg",
        "IMG20251127212020.jpg",
        "IMG20251209163512.jpg",
        "IMG_20251129_130926.jpg",
        "IMG_20251129_211406.jpg",
        "IMG_20251129_211417.jpg",
        "IMG_20251129_211431.jpg"
      ];

      try {
        const source = "https://raw.githubusercontent.com/snbconstructionandengineering-blip/snbconstruction/main/final%20index.html";
        const response = await fetch(source, { cache: "no-cache" });
        if (!response.ok) throw new Error("Could not load the website page.");

        const parser = new DOMParser();
        const page = parser.parseFromString(await response.text(), "text/html");

        const logo = page.querySelector(".brand img");
        if (logo) logo.src = "assets/snb-logo.svg";

        const gallery = page.querySelector("#gallery .gallery-grid");
        if (gallery) {
          gallery.replaceChildren(...photos.map((filename, index) => {
            const item = page.createElement("div");
            item.className = "gallery-item";
            item.setAttribute("role", "img");
            item.setAttribute("aria-label", `SNB precast girder project photo ${index + 1}`);
            item.style.backgroundImage = `url("assets/${filename}")`;
            return item;
          }));
        }

        document.open();
        document.write("<!doctype html>" + page.documentElement.outerHTML);
        document.close();
      } catch (error) {
        document.body.innerHTML = "<main style='font:16px system-ui;padding:2rem;color:#172b3a'><h1>Website could not load</h1><p>Please refresh the page. If the problem continues, check that GitHub Pages is enabled and that the repository files are available.</p></main>";
      }
    })();
  </script>
</body>
</html>

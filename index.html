<html lang="en">
<head>

</head>
<body>
<p id="loading">Loading SNB Construction &amp; Engineering…</p>
<script>
(async function(){
  const ongoingPhotos=["IMG-20250816-WA0020.jpg","IMG-20250816-WA0021.jpg","IMG-20250816-WA0079.jpg","IMG-20250816-WA0104.jpg","IMG-20250819-WA0002.jpg","IMG-20250819-WA0043.jpg","IMG-20250823-WA0009.jpg","IMG-20250827-WA0051.jpg","IMG-20250828-WA0055.jpg","IMG-20250831-WA0019.jpg","IMG-20251115-WA0011.jpg","IMG-20251118-WA0005.jpg","IMG-20251124-WA0056.jpg","IMG-20251202-WA0044.jpg","IMG20241014173127.jpg","IMG20250601160609.jpg","IMG20251127212020.jpg","IMG20251209163512.jpg","IMG_20251129_130926.jpg","IMG_20251129_211406.jpg","IMG_20251129_211417.jpg","IMG_20251129_211431.jpg"];
  const completedPhotos=["2022-05-25 12_59_31.jpg","IMG-20250526-WA0002.jpg","IMG-20250526-WA0010.jpg","IMG-20250526-WA0012.jpg","IMG-20250526-WA0021.jpg","IMG-20250526-WA0024.jpg","IMG-20250526-WA0033.jpg","IMG-20250526-WA0039.jpg","IMG-20250526-WA0040.jpg","IMG-20250526-WA0042.jpg","IMG-20250526-WA0047.jpg","IMG-20250526-WA0056.jpg","IMG-20250526-WA0058.jpg","IMG-20250526-WA0059.jpg","IMG-20250526-WA0061.jpg","IMG-20250526-WA0066.jpg","IMG-20250526-WA0071.jpg","IMG-20250526-WA0073.jpg","IMG-20250526-WA0080.jpg"];
  try{
    const response=await fetch("https://raw.githubusercontent.com/snbconstructionandengineering-blip/snbconstruction/main/final%20index.html",{cache:"no-cache"});
    if(!response.ok)throw new Error("Could not load website.");
    const page=new DOMParser().parseFromString(await response.text(),"text/html");
    const logo=page.querySelector(".brand img");if(logo)logo.src="assets/snb-logo.svg";
    const projects=page.querySelector("#projects"),heading=projects?.querySelector(".section-head"),grid=projects?.querySelector(".projects-grid");
    if(heading){const eyebrow=heading.querySelector(".eyebrow"),title=heading.querySelector("h2");if(eyebrow)eyebrow.textContent="Completed project";if(title)title.textContent="Rupsha 800MW Dual cycle Power plant";}
    if(grid){
      grid.replaceChildren();
      const card=page.createElement("article");card.className="project-card";
      const cover=page.createElement("div");cover.className="photo";cover.style.backgroundImage=`url("assets/${encodeURIComponent(completedPhotos[0])}")`;cover.setAttribute("role","img");cover.setAttribute("aria-label","Rupsha 800MW Dual cycle Power plant project photo");
      const info=page.createElement("div");info.className="info";const name=page.createElement("h3");name.textContent="Rupsha 800MW Dual cycle Power plant";const location=page.createElement("p");location.textContent="Khalishpur, Khulna";info.append(name,location);card.append(cover,info);grid.append(card);
      const photos=page.createElement("div");photos.className="gallery-grid";photos.style.marginTop="18px";
      completedPhotos.forEach((filename,index)=>{const image=page.createElement("div");image.className="gallery-item";image.style.backgroundImage=`url("assets/${encodeURIComponent(filename)}")`;image.setAttribute("role","img");image.setAttribute("aria-label",`Rupsha power plant completed project photo ${index+1}`);photos.append(image);});grid.after(photos);
    }
    const gallery=page.querySelector("#gallery .gallery-grid");if(gallery)gallery.replaceChildren(...ongoingPhotos.map((filename,index)=>{const item=page.createElement("div");item.className="gallery-item";item.setAttribute("role","img");item.setAttribute("aria-label",`SNB precast girder project photo ${index+1}`);item.style.backgroundImage=`url("assets/${encodeURIComponent(filename)}")`;return item;}));
    // Keep the ongoing project and its photo gallery above the completed project section.
    const ongoingSection=page.querySelector("#ongoing-projects"),ongoingGallery=page.querySelector("#gallery");
    if(projects&&ongoingSection&&ongoingGallery)ongoingGallery.after(projects);
    document.open();document.write("<!doctype html>"+page.documentElement.outerHTML);document.close();
  }catch(error){document.body.innerHTML="<main style='font:16px system-ui;padding:2rem;color:#172b3a'><h1>Website could not load</h1><p>Please refresh the page and check GitHub Pages deployment.</p></main>";}
})();
</script>
</body>
</html>

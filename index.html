<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="SNB Construction and Engineering — professional construction and engineering in Moulvibazar and Sylhet.">
  <title>SNB Construction &amp; Engineering</title>
  <style>
    :root {
      --bg: #f3f5f7 !important;
      --surface: #ffffff !important;
      --ink: #172b3a !important;
      --muted: #526273 !important;
      --steel: #205b78 !important;
      --accent: #c6923a !important;
      --line: #d5dde5 !important;
      --dark: #102a43 !important;
      --on-dark: #f7f9fb !important;
    }
    .logo img {
      display: block;
      width: min(220px, 48vw);
      height: auto;
      max-height: 52px;
      object-fit: contain;
    }
    .logo i { display: none !important; }
    #gallery .chips {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      margin: 0 0 18px;
      border-bottom: 2px solid var(--line);
      overflow-x: auto;
    }
    #gallery .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      padding: 10px 14px;
      margin: 0;
      border: 1px solid var(--line);
      border-bottom: 0;
      border-radius: 8px 8px 0 0;
      color: var(--steel);
      background: #e8edf1;
      white-space: nowrap;
    }
    #gallery .chip::before {
      content: "";
      width: 17px;
      height: 14px;
      display: inline-block;
      background: currentColor;
      clip-path: polygon(0 18%, 38% 18%, 50% 34%, 100% 34%, 100% 100%, 0 100%);
    }
    #gallery .chip.on {
      color: #fff;
      background: var(--steel);
      border-color: var(--steel);
    }
    #gallery .gal {
      padding: 18px;
      background: #e8edf1;
      border: 1px solid var(--line);
      border-radius: 0 8px 8px 8px;
    }
    #gallery .gi {
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fff;
      box-shadow: 0 2px 8px #102a4314;
    }
    #gallery .gi:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 14px #102a4322;
    }
    .facebook-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      color: var(--accent) !important;
      font-weight: 600;
      text-decoration: none;
    }
    .facebook-link:hover { text-decoration: underline; }
    @media (max-width: 760px) {
      #gallery .chips { margin-right: -20px; padding-right: 20px; }
      #gallery .gal { padding: 10px; }
    }
  </style>
</head>
<body>
  <p id="loading" style="font:16px system-ui;padding:2rem;color:#172b3a">Loading SNB Construction &amp; Engineering…</p>
  <script>
    (async function () {
      try {
        // Load the last complete page version so its actual project details and photos stay intact.
        const source = "https://raw.githubusercontent.com/snbconstructionandengineering-blip/snbconstruction/4811d9adba9d94cc819fd1f16d47b034ebf2403d/final%20index.html";
        const response = await fetch(source, { cache: "force-cache" });
        if (!response.ok) throw new Error("Could not load the website page.");
        let html = await response.text();

        html = html.replace(
          '<a class="logo" href="#top"><i>S</i>SNB Construction</a>',
          '<a class="logo" href="#top" aria-label="SNB Construction and Engineering"><img src="./assets/snb-logo.svg" alt="SNB Construction and Engineering"></a>'
        );
        html = html.replace(
          "</footer>",
          '<p class="wrap"><a class="facebook-link" href="https://www.facebook.com/share/1CHEQ1rjdH/" target="_blank" rel="noopener noreferrer">Visit SNB Construction on Facebook</a></p></footer>'
        );

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = "<main style='font:16px system-ui;padding:2rem;color:#172b3a'><h1>Website could not load</h1><p>Please refresh the page. If the problem continues, check your internet connection.</p></main>";
      }
    })();
  </script>
</body>
</html>
